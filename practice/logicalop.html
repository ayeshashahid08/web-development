<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>logical operators</title>
</head>
<body>
<script>
    let a = 100;
    let b = 20;
    let result = (a > 5 && b < 30) || (a < 5 && b > 30);
    document.write("Result of logical operation: " + result);

</script>
</body>
</html>
