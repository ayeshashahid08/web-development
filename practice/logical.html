
<!DOCTYPE html>
<html lang="en">
<head>
    <title>JavaScript Control Structures</title>
</head>
<body>
    <h1>JavaScript Control Structures</h1>
    <div>
        <h2>1. if / else</h2>
        <script>
            let age = 30;
            let grade = "A";
            if ((age >= 20) && (grade === "A")) {
                document.write("<p>You passed.</p>");
            } else {
                document.write("<p>You failed.</p>");
            }
        </script>
    </div>

    <div>
        <h2>2. switch</h2>
        <script>
            let dayname="Thursday";
            let classname="370";
            

            switch (`${dayname}-${classname}`) {
                case "Thursday-370":
                    document.write("web dev class on thursday");
                    break;
                default:
                    document.write("no class today");
            }

            document.write("<p>Today is " + dayname + " and the class is " + classname + ".</p>");
        </script>
    </div>

    <div>
        <h2>3. for loop</h2>
        <script>
            document.write("<p>multiplication table for 5: ");
            for (let i = 1; i <= 10; i++) {
                document.write("5 x " + i + "= "+ 5*i +"<br>");
                
            }
            document.write("</p>");
        </script>
        <h2>another way of iterating</h2>
        <script>
            const arr= ["ali", "faisal", "khan", "kashif"];
            for (const name of arr){
                document.write(`<p>${name}</p>`)
            }
        </script>
    </div>

    <div>
        <h2>4. while loop</h2>
        <script>
            let count = 1;
            document.write("<p>");
            while (count <= 5) {
                document.write(count + " ");
                count++;
            }
            document.write("</p>");
        </script>
    </div>

    <div>
        <h2>5. break</h2>
        <script>
            document.write("<p>");
            for (let i = 1; i <= 10; i++) {
                if (i === 6) {
                    break;
                }
                document.write(i + " ");
            }
            document.write("</p>");
        </script>
    </div>

    <div>
        <h2>6. continue</h2>
        <script>
            document.write("<p>");
            for (let i = 1; i <= 6; i++) {
                if (i === 3) {
                    continue;
                }
                document.write(i + " ");
            }
            document.write("</p>");
        </script>
    </div>
</body>

</html>
